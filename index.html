<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>마음의 숲 · EAP 고객사 사전조사 접수</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f6f7f9;color:#1a1f2b;line-height:1.6;font-size:15px}
#boot{max-width:560px;margin:0 auto;padding:80px 20px;text-align:center;color:#4b5364}
#boot .b{font-weight:700;color:#1e6b4f;margin-bottom:22px;font-size:15px}
#boot .s{font-size:14px;color:#8a91a3}
#boot .err{margin-top:22px;text-align:left;background:#fdeceb;border:1px solid #f3c9c5;color:#b3382c;border-radius:8px;padding:14px 16px;font-size:13.5px;line-height:1.7;word-break:break-all}
#boot .err b{display:block;margin-bottom:6px;font-size:14px}
#boot button{margin-top:16px;padding:9px 18px;border:1px solid #d4d8e2;background:#fff;border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
#upd{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#1e6b4f;color:#fff;padding:11px 16px;font-size:14px;display:none;align-items:center;justify-content:center;gap:14px;box-shadow:0 -2px 10px rgba(0,0,0,.12)}
#upd button{background:#fff;color:#1e6b4f;border:0;border-radius:6px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div id="boot">
  <div class="b">마음의 숲 · EAP 고객사 사전조사 접수</div>
  <div class="s">화면을 불러오는 중입니다…</div>
</div>

<div id="upd">
  <span>새 버전이 배포되었습니다.</span>
  <button onclick="location.reload(true)">새로고침</button>
</div>

<script>
/* ──────────────────────────────────────────────────────────────
   로더 (loader)
   이 파일은 한 번만 GitHub 에 올리면 되고, 다시 고칠 일이 없습니다.
   실제 화면 코드는 Supabase 의 app_bundles 테이블에서 매번 받아옵니다.
   → Claude 가 그 테이블을 갱신하면, 새로고침만으로 사이트가 바뀝니다.
   ────────────────────────────────────────────────────────────── */
const SUPABASE_URL  = 'https://llmfsdcjixiiudwnkoqu.supabase.co';
const SUPABASE_ANON  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsbWZzZGNqaXhpaXVkd25rb3F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNDI0MTAsImV4cCI6MjA5NTcxODQxMH0.dKP5MEfwBxGBxSs6jGFROoBbQRcdnethu_zF4LAM7pw';
const BUNDLE_NAME   = 'prescan';
const POLL_MS       = 90000;   // 새 버전 확인 주기

const REST = (sel) =>
  `${SUPABASE_URL}/rest/v1/app_bundles?name=eq.${BUNDLE_NAME}&select=${sel}`;
const HEAD = { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON };

function fail(title, detail) {
  const el = document.getElementById('boot');
  if (!el) return;
  el.innerHTML =
    '<div class="b">마음의 숲 · EAP 고객사 사전조사 접수</div>' +
    '<div class="err"><b>' + title + '</b>' + detail + '</div>' +
    '<button onclick="location.reload(true)">다시 시도</button>';
}

async function fetchRow(sel) {
  const r = await fetch(REST(sel), { headers: HEAD, cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' · ' + (await r.text()).slice(0, 300));
  const rows = await r.json();
  if (!rows.length) throw new Error('번들이 없습니다 (app_bundles.' + BUNDLE_NAME + ')');
  return rows[0];
}

async function inflate(b64) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}

async function boot() {
  if (typeof DecompressionStream === 'undefined') {
    fail('브라우저가 너무 오래되었습니다',
         '크롬 · 엣지 · 사파리 최신 버전에서 열어 주세요. (인터넷 익스플로러는 지원하지 않습니다.)');
    return;
  }

  let row;
  try {
    row = await fetchRow('version,gz');
  } catch (e) {
    fail('화면 코드를 받지 못했습니다', String(e.message || e));
    return;
  }

  let app;
  try {
    app = JSON.parse(await inflate(row.gz));
  } catch (e) {
    fail('화면 코드가 손상되었습니다', String(e.message || e));
    return;
  }

  const style = document.createElement('style');
  style.textContent = app.css;
  document.head.appendChild(style);

  const upd = document.getElementById('upd');
  document.body.innerHTML = app.body;
  document.body.appendChild(upd);

  window.__BUNDLE_VERSION__ = row.version;

  const script = document.createElement('script');
  script.type = 'module';
  script.textContent = app.js;
  document.body.appendChild(script);

  // 새 버전이 배포되면 하단에 알림 띄우기
  setInterval(async () => {
    try {
      const now = await fetchRow('version');
      if (now.version !== window.__BUNDLE_VERSION__) upd.style.display = 'flex';
    } catch (_) { /* 네트워크 일시 오류는 무시 */ }
  }, POLL_MS);
}

boot();
</script>
</body>
</html>
