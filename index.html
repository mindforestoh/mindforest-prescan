function fmtDate(v){ if(!v) return ''; const d=new Date(v); return isNaN(d)?'':
`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dday(due){ if(!due) return null; const t=new Date(due+'T00:00:00'); if(isNaN(t)) return null;
  const n=new Date(), today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const d=Math.round((t-today)/86400000); return d===0?'D-DAY':(d>0?`D-${d}`:`D+${-d}`); }
function ddayTone(due){ if(!due) return 't-gray';
  const t=new Date(due+'T00:00:00'), n=new Date(), today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const d=Math.round((t-today)/86400000); return d<0?'t-red':(d<=3?'t-amber':'t-blue'); }
const statusTone = s => s==='완료'?'t-green':(s==='조사중'?'t-blue':'t-gray');
const fmtSize = b => !b ? '' : (b<1024?`${b}B`:(b<1048576?`${(b/1024).toFixed(0)}KB`:`${(b/1048576).toFixed(1)}MB`));
const safeKey = n => n.normalize('NFC').replace(/[^\w.\-]+/g,'_').slice(-80);

/* ---------------- 다운로드 유틸 ---------------- */
function downloadBlob(filename, content, mime){
  const blob = new Blob(['﻿', content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
async function copyText(text){
  try{ if(navigator.clipboard?.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
  ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0,text.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
  document.body.removeChild(ta); return ok;
}

/* ---------------- 파일 ---------------- */
async function listFiles(intakeId){
  const { data, error } = await sb.from('prescan_files')
    .select('*').eq('intake_id', intakeId).order('created_at');
  if(error){ showErr(`첨부 목록 오류: ${error.message}`); return []; }
  return data || [];
}
async function uploadFiles(intakeId, files, kind, onProgress){
  const ok = [];
  for(let i=0;i<files.length;i++){
    const f = files[i];
    onProgress?.(`${i+1}/${files.length} ${f.name} 올리는 중…`);
    if(f.size > 25*1024*1024){ showErr(`${f.name} 은 25MB를 넘어 건너뜁니다.`); continue; }
    const path = `${intakeId}/${crypto.randomUUID()}-${safeKey(f.name)}`;
    const up = await sb.storage.from(BUCKET).upload(path, f, { upsert:false, contentType:f.type||'application/octet-stream' });
    if(up.error){ showErr(`${f.name} 업로드 실패: ${up.error.message}`); continue; }
    const ins = await sb.from('prescan_files').insert({
      intake_id:intakeId, name:f.name, path, doc_kind:kind,
      size_bytes:f.size, mime:f.type||null, created_by:me.id });
    if(ins.error){ showErr(`${f.name} 등록 실패: ${ins.error.message}`); continue; }
    ok.push(f.name);
  }
  return ok;
}
async function openFile(f){
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(f.path, 120, { download: f.name });
  if(error) return showErr(`다운로드 실패: ${error.message}`);
  window.open(data.signedUrl, '_blank');
}
async function removeFile(f){
  if(!confirm(`'${f.name}' 을 삭제할까요?`)) return false;
  const s = await sb.storage.from(BUCKET).remove([f.path]);
  if(s.error) showErr(`파일 삭제 경고: ${s.error.message}`);
  const d = await sb.from('prescan_files').delete().eq('id', f.id);
  if(d.error){ showErr(`삭제 실패: ${d.error.message}`); return false; }
  toast('삭제했습니다.'); return true;
}

/* 드래그·선택 겸용 파일 피커 */
function filePicker(el, onPick){
  const input = el.querySelector('input[type=file]');
  el.addEventListener('click', e => { if(e.target !== input) input.click(); });
  input.addEventListener('change', () => { if(input.files.length) onPick([...input.files]); input.value=''; });
  ['dragenter','dragover'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();el.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();el.classList.remove('over');}));
  el.addEventListener('drop', e => { const fs=[...(e.dataTransfer.files||[])]; if(fs.length) onPick(fs); });
}

async function loadMe(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ me=null; return; }
  const { data, error } = await sb.from('app_profiles')
    .select('id,email,name,role,active').eq('id', session.user.id).maybeSingle();
  me = error ? { id:session.user.id, email:session.user.email, role:null, active:false }
     : (data ? { ...data, email:data.email||session.user.email }
             : { id:session.user.id, email:session.user.email, role:null, active:false });
}

${isReset?'':`<a href="#" id="toForgot" class="muted">비밀번호를 잊으셨나요?</a>`}
<a href="#" id="swap" class="muted">${isReset?'로그인으로 돌아가기':(isSignup?'이미 계정이 있습니다 · 로그인':'계정이 없으신가요? 회원가입')}</a>
</div>
<p class="muted" style="margin-top:16px;text-align:center;font-size:12px">관리자가 등록한 이메일만 접수 데이터를 볼 수 있습니다.</p>
</div>`;
  $('#swap').onclick = e => { e.preventDefault(); viewAuth(isReset?'login':(isSignup?'login':'signup')); };
  const tf=$('#toForgot'); if(tf) tf.onclick = e => { e.preventDefault(); viewAuth('forgot'); };
  $('#f').onsubmit = async e => {
    e.preventDefault(); clearErr();
    const btn=$('#sub'); btn.disabled=true;
    const email=$('#email').value.trim();
    try{
      if(isReset){
        const { error } = await sb.auth.resetPasswordForEmail(email,{ redirectTo: location.origin + location.pathname });
        if(error) throw error;
        toast('재설정 메일을 보냈습니다. 받은편지함과 스팸함을 확인해 주세요.');
      } else if(isSignup){
        const { data, error } = await sb.auth.signUp({ email, password:$('#pw').value });
        if(error) throw error;
        if(data.session){ toast('가입이 완료되었습니다.'); await boot(); }
        else toast('가입 확인 메일을 보냈습니다. 메일의 링크를 눌러 인증해 주세요.');
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password:$('#pw').value });
        if(error) throw error;
        await boot();
      }
    }catch(err){
      const m = err?.message || '알 수 없는 오류';
      if(/already registered/i.test(m)) showErr("이미 가입된 이메일입니다. '비밀번호를 잊으셨나요?'로 재설정해 주세요.");
      else if(/Invalid login credentials/i.test(m)) showErr('이메일 또는 비밀번호가 올바르지 않습니다.');
      else showErr(`실패: ${m}`);
    }finally{ btn.disabled=false; }
  };
}

  $('#sf').onsubmit = async e => {
    e.preventDefault(); clearErr();
    const email=$('#se').value.trim().toLowerCase();
    const { error } = await sb.from('app_role_seed').upsert({ email, role:$('#sr').value });
    if(error) return showErr(`등록 실패: ${error.message}`);
    toast('초대를 등록했습니다.'); $('#se').value=''; loadSeeds();
  };
  loadSeeds(); loadProfiles();
}

/* ---------------- 내 계정 ---------------- */
function viewAccount(){
  app.innerHTML = `<h1 style="margin-bottom:14px">내 계정</h1><div id="errbox"></div>
<div class="card"><table style="margin-bottom:16px">
<tr><th style="width:120px">이메일</th><td>${esc(me.email)}</td></tr>
<tr><th>역할</th><td><span class="tag t-blue">${esc(me.role||'—')}</span></td></tr></table>
<h2>비밀번호 변경</h2>
<div class="note amber">변경이 거부되면 화면에 서버가 보낸 원문 오류가 그대로 표시됩니다. 그 문구를 알려주시면 원인을 바로 잡을 수 있습니다.</div>
<form id="f"><div class="grid2">
<div class="field"><label>새 비밀번호</label><input id="p1" type="password" required minlength="6" autocomplete="new-password"></div>
<div class="field"><label>새 비밀번호 확인</label><input id="p2" type="password" required minlength="6" autocomplete="new-password"></div></div>
<button class="primary" type="submit">변경</button></form></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); clearErr();
    if($('#p1').value !== $('#p2').value) return showErr('비밀번호가 일치하지 않습니다.');
    const { data, error } = await sb.auth.updateUser({ password:$('#p1').value });
    if(error){ showErr(`변경 실패 (원문): ${error.message}${error.status?` [HTTP ${error.status}]`:''}`); return; }
    toast('비밀번호를 변경했습니다.'); $('#f').reset();
  };
}

/* ---------------- 라우팅 ---------------- */
function renderNav(){
  nav.innerHTML = `<a href="#/list"><button class="ghost">목록</button></a>
<a href="#/new"><button class="primary">새 접수</button></a>
${isAdmin()?'<a href="#/members"><button class="ghost">멤버 관리</button></a>':''}
<a href="#/account"><button class="ghost">내 계정</button></a>
<button class="ghost" id="out">로그아웃</button>`;
  $('#out').onclick = async () => { await sb.auth.signOut(); me=null; location.hash='#/list'; boot(); };
}
function viewNoAccess(){
  nav.innerHTML = `<button class="ghost" id="out">로그아웃</button>`;
  $('#out').onclick = async () => { await sb.auth.signOut(); me=null; boot(); };
  app.innerHTML = `<div class="center card" style="text-align:center"><h1>접근 권한이 없습니다</h1>
<p class="muted" style="margin-top:10px;line-height:1.7">등록되지 않았거나 비활성 상태인 계정입니다.<br>관리자(오경훈)에게 접근 권한을 요청해 주세요.</p>
<p class="muted" style="margin-top:12px;font-size:12px">현재 로그인: ${esc(me?.email||'')}${me?.role?` · 역할 ${esc(me.role)}`:''}</p></div>`;
}
function route(){
  if(recovery) return viewSetPassword();
  if(!me) return viewAuth('login');
  if(!isStaff()) return viewNoAccess();
  renderNav();
  const h = location.hash || '#/list';
  if(h.startsWith('#/i/')) return viewDetail(h.slice(4));
  if(h.startsWith('#/new')) return viewNew();
  if(h.startsWith('#/members')) return viewMembers();
  if(h.startsWith('#/account')) return viewAccount();
  return viewList();
}
async function boot(){ await loadMe(); route(); }
sb.auth.onAuthStateChange(ev => {
  if(ev === 'PASSWORD_RECOVERY'){ recovery = true; viewSetPassword(); return; }
  if(ev === 'SIGNED_OUT'){ me=null; route(); }
});
window.addEventListener('hashchange', route);
if(location.hash.includes('type=recovery')) recovery = true;
boot();
</script>
</body>
</html>
